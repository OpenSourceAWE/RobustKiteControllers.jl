# Local variant of V3Kite's data/kite_settings_psm.yaml (a plain copy of which is
# kite_settings_psm.yaml next to this file), named by system_reelout_maasvlakte.yaml
# and system_reelout_cabauw.yaml. V3Kite looks for a project's `kite_settings:` file
# beside the project first, so this file is the one those runs fly.
#
# Against V3Kite's file it differs in three keys, of which only one acts:
#   - analytic_jacobian: true here (the kernel backend's default), false upstream.
#     A Cabauw run at 10 m/s flew the same within 0.05 % either way (2026-10-02).
#   - vsm_interval and body_sim_damping: both NOT read by this package's runs, see
#     their comments below.
kite_settings:
  wing_type: particle_dynamics   # particle_dynamics | rigid_dynamics
  aero_mode: continuous          # direct | continuous | pressure
  backend: kernel                # monolith | kernel model assembly
  analytic_jacobian: true        # null takes the backend default (kernel: true)
  vsm_interval: 10               # NOT read by this package's runs: they pass fc_settings' run.vsm_interval to step!

  body_sim_damping: [0.0, 0.0, 32.0]   # NOT read: init_model passes 0.8 x fc_settings' run.body_damping to init
  world_sim_damping: [0.0, 0.0, 0.0]  # per-axis world-frame damping in flight

  # INERT in this run path, despite the name: the only consumer of `wing_mass` in
  # V3Kite is examples/flight_replay.jl, guarded by `wing_mass > 0`. The wing mass
  # that actually reaches the model is `mass` in the project's sim_settings file, which
  # SymbolicAWEModels distributes over the wing points because their own extra_mass
  # is 0. Left at 0.0 so it cannot be mistaken for the live value; `0` also means
  # "keep what the geometry carries" if this path ever does read it.
  wing_mass: 0.0                 # [kg] mass redistributed over the wing nodes
  wing_mass_le_frac: 0.75        # leading-edge share of `wing_mass`
  wing_drag_coeff: 0.0           # parasitic drag spread over the wing nodes

  adapter_dir: null              # SurfplanAdapter export for Comer-Levy bending

  init_mode: settle              # settle | relaxed_state
  init_state: null               # relaxed state settling starts from

  remake_model: false            # true rebuilds the serialized model bin
  remake_settled_state: false   # true re-runs settling instead of loading the arrow
  brake: true                    # winch brake engaged after bring-up

  geom:
    reduce_tip: false            # shorten the tip segments
    tip_reduction: 0.4           # [m] taken off each tip segment
    tip_segments: [47, 48, 57, 58]  # segment indices the tip reduction hits
    reduce_te: false             # shorten the trailing-edge segments
    te_frac: 0.95                # fraction of rest length the TE keeps
    te_segments: [20, 28]        # first/last TE segment index
    reduce_depower: false        # shorten the depower tape
    depower_reduction: 0.2       # [m] taken off the depower tape
    depower_offset: 0.0          # added to every depower command (0..1)
    steering_dp_offset: 0.0      # extra depower per unit |steering|
    reduce_steering: false       # shorten the steering tapes
    steering_reduction: 0.2      # [m] taken off each steering tape
    tether_length: null          # [m] overrides the settings tether length

  bridle:
    compression_frac: 0.01           # stiffness a segment keeps in compression
    compression_damping_frac: 1.0    # the same for the damping term
    bridle_rel_damping: 0.01         # [s] damping per stiffness on lines/tapes
    pulley_efficiency: 0.95          # line tension a sheave passes on
