# Externally optimized path settings. Loaded into a `TrajOptSettings` struct; each section
# below is a part of that struct (src/traj_opt_settings.jl) and each key a field of that
# part. A missing key falls back to the struct default, an unknown key is an error.
# Tuning record in docs/fig8_tuning_log.md.
traj_opt:
  server:  # AWETrim server, request caches and the winch law sent
    base_url: "http://127.0.0.1:8000"  # address of the AWETrim server
    opt_failure_cache: true  # skip requests recorded as failing; see the docstring
    opt_success_cache: true  # replay applied results of an identical request chain; clear after an AWETrim change
    opt_warm_start_awe_trim: 1.0   # use_awe_trim of the seeding solve; 0.0 = off  [-]
    opt_awe_trim:      1.0 # use_awe_trim sent to the server; < 0 follows wc_settings [-]
    free_speed_reference_points: 6  # free_speed solves for the reference power AFTER the run; 0 = off [-]

  guess:  # initial guess; seeds a multi-modal solve: changes the answer, not the run time
    guess_a:          30.0   # width of the guess; azimuth spans ±guess_a    [deg]
    guess_b:          12.0   # height of the guess, peak to peak             [deg]
    guess_el_center:  29.0   # centre elevation of the guess; first knob to move on a 422 [deg]
    guess_el_center_high:      33.0   # centre elevation at/above the ref wind (a step, not a ramp); 33 keeps
                                      # the bottom of the 17° high-wind figure above min_elevation [deg]
    guess_el_center_wind_ref:   8.0   # wind at/above which guess_el_center_high applies [m/s]
    startup_retry_el_offsets: [-1.0, 2.0, -2.0]   # seeds tried in order on a startup 422; [] never retries [deg]
    # Above this wind the startup solve starts here and steps the wind up warm to the run's
    # (src/startup_path.jl, startup_solve); 0.0 = off. The 2026-11-05 ROM depowers far in
    # strong wind: Cabauw 10 m/s failed cold from every seed, solved through 7-8-9-10 m/s.
    startup_wind_ramp_start:    7.0   # [m/s at the reference height]
    startup_wind_ramp_step:     1.0   # [m/s]

  seed:  # depower seed of the solve, ramped with the wind
    input_depower:     1.6   # depower SEED in metres of tape (the ROM's band 1.5-2.6), not depower_setpoint [m]
    input_depower_wind_ref:  7.0   # wind at which input_depower IS the seed  [m/s]
    input_depower_per_wind:  0.25  # tape added per m/s above that; one-sided [m/(m/s)]
    input_depower_seed_max:  2.45  # ramp ceiling, inside the 2026-11-05 ROM's 2.6 m (1.85 for the old ROM): at
                                   # 10 m/s the optimum is near 2.4 m and a seed at 1.85 cannot be marched [m]
    # Estimate of the tape length the startup reply is FLOWN at, which sizes the turn-radius
    # request; 0 takes the seed above. Fitted 2026-10-05 to the startup replies of the base
    # runs (Cabauw 4-10, Maasvlakte 8, 11 m/s) against the wind at the caps' height (100 m):
    # 1.43-1.47 m up to ~12 m/s there, then ~0.05 m per m/s (Cabauw 10 m/s, 19.3 m/s: 1.91 m).
    # The seed ramps on the 6 m wind and seeded Maasvlakte 8 m/s at 1.85 m against 1.46 m flown.
    request_depower:          1.45  # estimate at and below the ref wind aloft [m]
    request_depower_wind_ref: 10.4  # wind at the caps' height above which it ramps [m/s]
    request_depower_per_wind: 0.05  # tape added per m/s of wind aloft above that [m/(m/s)]
    depower_fixed:           0.0   # pin the solved tape length to this; 0.0 lets the server optimize it [m]
    # Added to every reply's converted rel_depower, to bring the mean power_ratio to ~1.0.
    # Maasvlakte 2026-10-26: mean power_ratio 0.75 at 0; at -0.013 4/7/10 m/s flew
    # 0.97/0.88/0.91, i.e. d ln P / d rel_depower ~ -16, so -0.018 (docs/fig8_tuning_log.md).
    # 2026-11-07, 2026-11-05 ROM: V3Kite tape = ROM tape - 0.372 m (std 0.010 m) at matched
    # lift + drag resultant, from validate_lift_drag.jl and AWETrim's
    # examples/server/identify_depower_offset.py; -0.372 m / 5 m = -0.074. Power ratios
    # 0.89-1.11 at 4/7/10 m/s on both sites; redo whenever the ROM or V3Kite changes.
    depower_offset:          -0.074   # [-]

  box:  # pattern box the optimizer solves UNDER; 0.0 keeps the server default (|az| <= 45.8, 0.6 <= el <= 51.6)
    pattern_azimuth_max: 28.0        # closes the wide basin seen at 5.5 m/s; good runs fly ±18-25 [deg]
    pattern_azimuth_max_high: 34.0   # cap at/above pattern_elevation_amplitude_max_wind_ref: under the 45° climb
                                     # limit Cabauw 10 needs ±28.4-28.8° at 150 m and IPOPT 2-3° of room: 422 under
                                     # 28 and 29 at r_min 22.8 m, under 30 at 23.5 m (quadratic depower
                                     # conversion); converges under 31 and 32 (2026-10-03). 36 -> 34 (2026-10-05):
                                     # at 36 the re-optimizations at Cabauw 10 grew to ±32° x 21°, RMS d 1.61°;
                                     # at 34 ±22° x 16°, RMS d 1.44°, 22.7 instead of 20.4 kW [deg]
    pattern_elevation_amplitude_max: 8.5   # largest elevation HALF-SPAN of the figure; 0.0 = off [deg];
                                           # 8.0 left Maasvlakte 3.5 m/s infeasible at 8.12° (2026-09-24)
    pattern_elevation_amplitude_max_high:     17.0  # cap at/above the ref wind (a step, not a ramp); 13 left the
                                                    # 2026-11-05 ROM's 10 m/s laps faster than the 0.29 1/s steering slew [deg]
    pattern_elevation_amplitude_max_wind_ref: 12.5  # wind AT the height below at/above which the high cap
                                                    # (12.5 since 2026-11-07, so Maasvlakte 10 m/s at 12.9 gets it)
                                                    # applies: Maasvlakte 10 m/s is 12.9 there and flies under
                                                    # 8°, Maasvlakte 11 (14.2) and Cabauw 7-10 (13.5-19.3) need
                                                    # 10° or the startup solve loses its basin (2026-09-21);
                                                    # 11° since 2026-09-23: Cabauw 10 at f_high 7200 N needs
                                                    # 10.5-10.7° at the 150 m startup [m/s]
    pattern_elevation_amplitude_max_wind_height: 100.0  # height that wind is taken at; 0 = the 6 m wind [m]
    pattern_symmetric: true       # mirror-symmetric figure about azimuth 0; the solve is multi-modal and
                                  # otherwise lands lopsided (Cabauw 2026-09-25: centre -2.3°, lobes 214/147 points)
    pattern_climb_angle_max: 45.0 # steepest climb of the path in the az/el plane; descending is free; 0 is off [°]

  gates:  # every returned path, at startup and after a re-optimization
    min_feasibility_margin: 0.82  # curvature gate AND request (as min_turn_radius); 0.0 = off; an 8 m/s number [-]
    turn_radius_headroom: 1.25    # factor on the margin sent; covers the gate's own bites, makes slack [-]
    min_height: 40.0              # clearance gate at the anchor radius                                 [m]
    candidate_elevation_margin: 3.0   # gate margin above fc_settings' min_elevation [deg]

  reopt:  # re-optimization while the tether grows (simple_opt_reelout.jl)
    reopt_every_n_laps: 1    # laps between requests; never two solves at once   [-]
    max_reopt: 7             # bound on re-optimizations per run                 [-]
    reopt_blocking: true     # freeze the simulation until the reply lands       [-]
    path_blend_time: 6.0     # seconds over which the new path replaces the old  [s]
    blend_max_retries: 3     # fresh solves per rejected reply                   [-]
    size_box_growth: 1.3     # box SENT with a re-opt: this x the previous install's size; 0 is off [-]
    challenge_growth: 1.1    # growth above which a reply predicting less than the previous install 
                             # is cross-checked by a cold solve; 0 is off        [-]

  reopt_gates:  # the extra gates of a re-optimization reply
    min_power_frac: 0.3      # fraction of the startup install's power              [-]
    min_power_frac_prev: 0.85 # fraction of the previous install's power; 0 is off  [-]
    power_gate_wind_min: 4.0 # mean wind below which a negative pred bypasses     [m/s]
    max_size_growth: 1.3     # largest size ratio vs the previous install; 0 is off [-]
    blend_fold_margin: 0.5   # blend_folds: fraction of the endpoints' own radius   [-]
