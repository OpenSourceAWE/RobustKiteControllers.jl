# Winch settings of a run, named by the `wc_settings:` key of every system_*.yaml
# next to it and loaded into `WCSettings` — ONE struct covering both winch
# controller families since the 2026-08-16 merge (PlanWinchcontrol.md):
#
#   - TORQUE out, the `winch_*` block: V3Kite's cascaded length controller
#     (`winch_position_torque!`) and its force mode (`winch_force_torque!`).
#     These were `WC_Settings` in V3Kite and had this file to themselves.
#   - SPEED out, everything below that: WinchControllers.jl's own
#     `WinchController` (`v_set = kv*sqrt(force)` plus the two force limiters),
#     which `examples/simple_reelout.jl` layers on top of the position winch.
#     These used to live in a SECOND file, `wc_settings_reelout.yaml`, loaded by
#     hardcoded name — so a different reel-out project could not carry different
#     winch tuning. They come through the project key like everything else now.
#
# The two blocks share no key. A run uses one torque mode or the other; a key
# omitted here falls back to the struct default.
#
# The dated record of how the `winch_*` values were arrived at stays in V3Kite;
# new findings belong in docs/fig8_tuning_log.md.
wc_settings:
  # --- TORQUE: position mode (winch_position_torque!); the only block simple_fig8.jl reaches at compliance 0
  winch_pos_kp:       0.5    # Outer loop: length error [m] -> reel-out speed setpoint [1/s]
  winch_speed_k:      30.0   # Inner speed loop: speed error [m/s] -> torque [N*m*s/m]
  winch_speed_ti:     2.0    # Inner speed-loop integral time [s]; larger = weaker
  winch_torque_limit: 500.0  # Saturation of the inner loop's torque correction [N*m]
  winch_ff_scale:     1.0    # Force feed-forward [-]; 1.0 is a perfectly stiff drum
  winch_acc_ff:       1.0    # Acceleration feed-forward J*a*G/r [-]; 0.0 = off

  # --- TORQUE: force mode (winch_force_torque!), flown when fc_settings' compliance > 0;
  # --- winch_force_gains divides winch_len_kp and winch_damp by that compliance
  winch_force_tau:  10.0     # Reference-force low-pass time constant; NOT scaled by compliance [s]
  winch_len_kp:     100.0    # Length trim, length error [m] -> reference force [N/m]
  winch_damp:       500.0    # Viscous damping, reel-out speed -> force; not optional, the drum free-wheels [N*s/m]
  winch_force_min:  100.0    # Floor on the reference force, keeps the tether taut [N]

  # --- SPEED: WinchControllers.jl's WinchController (simple_reelout.jl) ------
  dt:            0.02      # overwritten with the plant's dt after loading      [s]
  test:          false     # unused; mode below already selects the REEL_OUT law
  mode:          "reelout" # "reelout" = kv*sqrt(force); "piecewise" reels in below f_low
  fac:           0.25      # factor for I and P of the lower force controller  [-]
  max_iter:      100       # max iterations of the PID solvers                [-]
  iter:          0         # actual iterations used; read-only, diagnostic
  t_startup:     0.25      # force limiters held in reset this long; does NOT ramp v_set [s]
  t_blend:       0.25      # blending time of the 3-channel mixer               [s]
  v_sat_error:   1.0       # input saturation of the speed controller        [m/s]
  v_sat:         3.5       # reel-out speed limit; also step!'s speed_limit  [m/s]
  v_ri_max:      8.0       # maximal reel-in speed                           [m/s]
  p_speed:       0.125     # P value of the speed controller                    [-]
  i_speed:       4.0       # I value of the speed controller                    [-]
  kb_speed:      4.0       # anti-windup back-calculation, speed controller     [-]
  kt_speed:      5.0       # tracking constant, speed controller                [-]
  vf_max:        2.75      # reel-out speed where "piecewise" mode's force saturates [m/s]
  pf_low:        0.000144  # P constant of the lower force controller           [-]
  if_low:        0.01125   # I constant of the lower force controller           [-]
  df_low:        0.000034  # D constant of the lower force controller           [-]
  nf_low:        7.0       # derivative filter N of the lower force controller  [-]
  kbf_low:       1.0       # anti-windup back-calculation, lower force ctrl     [-]
  ktf_low:       8.0       # tracking constant, lower force controller          [-]
  f_low:         700.0     # below: LowerForceController reels in; overridden per wind speed by winch_table.yaml [N]
  f_reelin:      700.0     # set force during a plain reel-in phase (unused here) [N]
  f_high:        7200.0    # upper limit, < max_force (8400); x first_lap_force_frac = the startup solve's f_max [N]
  f_high_awe_trim: 7200.0  # fixed f_high sent to AWETrim for re-optimizations; 0.0 = plain f_high [N]
  pf_high:       0.00023040 # P constant of the upper force controller          [-]
  if_high:       0.012     # I constant of the upper force controller           [-]
  df_high:       0.000034  # D constant of the upper force controller           [-]
  nf_high:       15.0      # derivative filter N of the upper force controller  [-]
  kbf_high:      1.0       # anti-windup back-calculation, upper force ctrl     [-]
  ktf_high:      10.0      # tracking constant, upper force controller          [-]
  winch_iter:    10        # iterations of WinchControllers' own winch model (unused here) [-]
  # max_acc is NOT the plant's `winch: max_acc:` (4.0, the length loop's default on the hold
  # paths). This one limits the rate of the speed law's v_set, and the reel-out scripts pass it
  # to winch_torque! as acceleration_limit; why 8 and not 4 is measured in simple_reelout.jl.
  max_acc:       8.0       # rate limit of v_set; the reel-out's acceleration_limit [m/s^2]
  damage_factor: 0.2       # winch damage weighting (unused here)               [-]
  jerk_factor:   0.9       # jerk weighting in the damage calculation (unused here) [-]
  # kv: `v_set = kv * sqrt(force)`. Since 2026-10-30 the kv column of winch_table.yaml
  # overrides this value (0.030 at 3-4 m/s, see there); before, it was flat at 0.0408 from
  # 3 to 12 m/s and was no column from 2026-10-02. The 10 m/s row was 0.039, identified
  # 2026-08-27 (sweep below), and went back to the sweep's other passing value
  # 2026-09-22 — see the note under the sweep. 11 and 12 m/s fly 0.0408
  # UNTESTED at the current tether and winch controller: the 2026-08-26 notes
  # (0.0558 at 10, 0.0738 shipped at 11, 12 m/s out of envelope) described a
  # DIFFERENT tether and winch controller and no longer apply. Their text
  # remains in git history; see also the 2026-08-27 entry in
  # docs/fig8_tuning_log.md.
  #
  # Lower kv reels out slower, the kite keeps more of the wind, and force and
  # power both rise — until the plant's 8400 N rating is reached. Sweep at
  # 10 m/s (150 -> 380 m, no turbulence; phase-4 peak force against the 8400 N
  # limit):
  #
  #   kv      mean F   peak F   power    ratio   verdict
  #   0.0408   6332 N   7294 N  20051 W   0.85   all 10 passed
  #   0.039    6690 N   7901 N  21161 W   0.84   all 10 passed
  #   0.0385   6759 N   8411 N  21247 W   0.85   FAILED max force
  #   0.036    7223 N   9371 N  22543 W   0.85   FAILED max force
  #
  # 0.039 shipped first: +5.5 % power for a phase-4 peak 499 N under the limit.
  # It is the knee: below it the gain collapses while the peak keeps climbing
  # (0.0385 bought 86 W and crossed the limit by 11 N) because the soft law
  # starts clamping against f_high 8000 N — mean force 6690 N, peaks 7901 N.
  # Force is far more kv-sensitive here than the retired 11 m/s sweep
  # suggested. power_ratio stays at 0.84-0.85 throughout: predicted and
  # measured power scale together with kv, so kv moves the power LEVEL, not
  # the plant-model gap.
  #
  # 0.0408 shipped instead from 2026-09-22, giving up that 5.5 %. The 499 N the
  # knee left was spent by a WIDER first lap: the startup request's
  # min_turn_radius is now sized at the depower the reply is flown at rather
  # than at depower_setpoint (it was asking 16.0 m where the curvature gate
  # wanted 24.5 m), and the wider path pulls harder. Peak 8410 N at 19.94 s,
  # 1.7 s into phase 4 — over the 8400 N rating by 10 N. The limiter cannot
  # answer it: at 2.48 s of force_limit_tau a ~1.5 s spike is half gone before
  # calc_vro_soft sees it, and both ways out of that (a shorter tau, an
  # asymmetric one) are measured CLOSED in docs/fig8_tuning_log.md. kv is not
  # filtered, so it is the lever that still works. The 0.0408 row above was
  # measured on the NARROWER path, so its 7294 N does not carry over — only its
  # slope (about -337 N of peak and -617 W per +0.001 of kv) does. Re-identify
  # it against the new path and write the measurement in here.
  #
  # The slope holds only below v_sat (3.5 m/s). Cabauw 10 m/s reels out at
  # 3.42 m/s mean, on the limit, so kv cannot lower its force: 0.043 made the
  # startup solve infeasible (2026-09-23). There the lever is f_high, see
  # docs/fig8_tuning_log.md.
  kv:            0.0408    # v_set = kv * sqrt(force); the kv column of winch_table.yaml overrides it [-]

  # --- SPEED: how the force limits are enforced (PlanWinchSpeed.md, stage 4) --
  force_limit:      "soft" # "soft" (optimizer's tension curve) | "hard" (two limiters); winch_table.yaml overrides
  softplus_beta:    0.001  # corner sharpness of the UPPER limit; larger = sharper [1/N]
  softminus_beta:   0.03   # corner sharpness of the LOWER limit, local law only; AWETrim is pinned to 1e-3 [1/N]
  v_sat_beta:       10.0   # corner sharpness of the v_sat clamp; .inf = hard clamp [s/m]
  soft_lfc:         true   # also replace the LowerForceController with a reel-in line
  v_reel_in:        -2.0   # reel-in speed at zero force [m/s]
  reel_in_beta:     22.0   # sharpness of the line/curve handover; needs * kv * sqrt(f_low) >= 8 everywhere [s/m]
  use_awe_trim:     0.0    # blend of the LOCAL law towards AWETrim's curve, in [0, 1]; the server gets opt_awe_trim [-]
  force_limit_tau:  1.0   # low-pass on the force before inverting; 0 = off [s]
