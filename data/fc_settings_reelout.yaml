# Flight-controller settings flown by examples/simple_reelout.jl and
# simple_opt_reelout.jl, named by the system_reelout_*.yaml projects next to it.
# A copy of fc_settings.yaml (simple_fig8.jl) with `compliance: 0`: REEL_OUT and
# V3Kite's FORCE mode both drive the winch, and simple_reelout.jl errors rather
# than picking one. Each section is a part of `FC_Settings` (src/fc_settings.jl)
# and each key a field of that part. The docstrings there stay on one line, the
# comments below carry the longer notes; a missing key falls back to the struct default,
# an unknown key is an error. The plant (sim_time, sample_freq, v_wind,
# l_tethers) is in the system project's settings file, the winch gains in
# wc_settings.yaml. Tuning history: docs/fig8_tuning_log.md.
fc_settings:
  course:  # heading/course loop: entry state machine, depower, PID, feedback, descent limiter
    park_time:          2.0      # Park: zero steering while the transients decay     [s]
    chi_dive:          -145.0    # Dive course; >90 descends, <90 climbs, 90 flat    [deg]
    chi_hold:           -90.0    # Course commanded during the hold                 [deg]
    dive_el_margin:     17.0     # Margin above el_center where the dive ends       [deg]
    hold_time:          0.8      # Duration of the hold                               [s]
    fig8_d_gate:        4.0      # Cross-track error, transition -> fig8            [deg]
    # 0.25 with the 73° relay sweeps' table; /1.084 = 0.23 with the low-elevation table, whose
    # c1(depower_setpoint)/c1(entry_depower) is 1.084 x higher, so the entry flies as tuned (2026-09-29).
    entry_gain:         0.23     # Factor on heading_p during the entry phases        [-]
    entry_depower:      0.34     # Depower during the entry phases                    [-]
    depower_setpoint:   0.274    # Depower on the pattern; 0.278 is the curvature ceiling at 150 m [-]
    depower_blend_time: 2.5      # Ramp of `rel_depower` to a new ladder target; 0 = step [s]
    # heading_p +8 % for guided α 0.306 and lower RMS d (2026-09-29).
    heading_p:          0.183805 # Gain at v_app_ref                                  [-]
    heading_i:          false    # Integral time [s], or false for no integral action
    heading_d:          0.141    # Derivative time; raised for the guided disk margin (2026-09-28, 2026-09-29) [s]
    heading_d_n:        2.0      # Derivative filter, max gain of the D path          [-]
    v_app_ref:          27.0     # Speed flown in phase 3; anchors the gain schedule [m/s]
    v_app_min:          10.0     # Lower clamp on v_app, limits the gain boost      [m/s]
    v_kite_heading:     5.0      # At/below: pure heading feedback                  [m/s]
    v_kite_course:      10.0     # At/above: pure course feedback                   [m/s]
    fig8_pure_course:   false    # Course alone from phase 3 on; schedule governs entry
    max_steering:       0.32     # Command limit; raising it is CLOSED, see the log    [-]
    entry_chi_max:      95.0     # Steepest course while off-path; 180 disables it   [deg]
    entry_d_gate:       12.0     # Cross-track error below which it is bypassed     [deg]
    entry_d_blend:      4.0      # Blend band above the gate, 0 = hard switch       [deg]
    entry_cut_margin:   30.0     # Distance from ±180° where chi_set's sign is noise [deg]

  feedforward:  # steering feed-forward from the path's curvature, phase 4 on
    # 0.7 with the 73° relay sweeps' table (deleted 2026-10-01); x1.084 = 0.76 with the low-elevation
    # table, turn_rate_coeffs.yaml, whose c1 at depower_setpoint is 1.084 x higher, so u_ff stays as
    # tuned (2026-09-29).
    ff_gain:            0.76     # Curvature feed-forward, u_ff = psi_dot_path/(c1 v_app); 0 = off, 1 = the law [-]
    ff_lead_time:       0.35     # Read the path's course rate this far ahead of Q; ~the dead time [s]
    ff_smooth:          6.0      # Arc the tangent change is averaged over               [deg]
    ff_tau:             0.2      # Low-pass on u_ff and the chord correction; 0 = none    [s]
    ff_d_fade:          6.0      # Cross-track error at which the ff is fully off; fades from half [deg]
    ff_err_fade:        60.0     # Course error at which the ff is fully off; fades from half  [deg]
    # Gravity turn of the turn-rate law in its fixed-c3 form, c3·sin(χ)·cos(β), read off the path at the
    # lead point (2026-10-04). Without it the P-only loop holds the gravity turn off with a course error and
    # the kite flies 1.1-2.2° below the path on horizontal legs at every wind speed. The free-c2 form
    # c2/v_a overshoots at low v_a and falls short at high v_a. 0.23 is the identified c3
    # (docs/turn_rate_fixed_c3.md); with el_offset_wing 0.5 the 22 replays pass, RMS d -2 to -31 % in 19.
    ff_gravity_rate:     0.23    # Gravity turn rate cancelled by the feed-forward, c3; 0 = off [1/s]

  pattern:  # pattern geometry and attractor; a SMALLER lemniscate is a TIGHTER one
    f8_a:               20.0     # Width of the eight, azimuth spans ±A; sweep optimum [deg]
    f8_b:               11.0     # Height, elevation spans ±B/2; picked for margin 1.07 [deg]
    el_center:          18.0     # Centre elevation; lower turns easier, costs energy [deg]
    # 8.0 -> 9.75 (2026-10-02, retune_guided.jl, target 0.4): worst guided disk margin of the 22
    # scenarios 0.332 -> 0.401 (weak winds, where this floor sets the attractor); replays at
    # maasvlakte 3.5/8.0 and cabauw 3.0 m/s pass all criteria, RMS d +20 - 29 %, power unchanged.
    # 9.75 -> 8.25 (2026-10-03, retune_guided.jl tighten, floor 0.51): worst guided disk margin
    # 0.523 -> 0.515, now maasvlakte 5 m/s; 8 m/s and up unchanged. Aim: lower RMS tracking error.
    # Floor ∝ 1/L since 2026-10-03: a fixed arc of 25.3 m, 8.35° at 175 m (9.7° at 150 m, 3.8° at
    # 380 m). Only attractor_dist * attractor_dist_ref_length matters; the smallest product keeping
    # the worst guided margin of the 22 scenarios >= 0.51 is 8.31° x 175 m (the same at L_ref 150-300).
    # Replays on the archived paths: RMS d -31 % maasvlakte 3.5, -28 % 5, -20 % 8, -25 % cabauw 4,
    # -5 % 6, -3 % 9 m/s; power within 2 %, max force unchanged, all criteria passed.
    attractor_dist:      8.35    # Arc distance Q -> attractor at attractor_dist_ref_length; the FLOOR under a lead time [deg]
    attractor_dist_ref_length: 175.0 # Tether length where attractor_dist holds, floor ∝ 1/L; 0 = fixed [m]
    # attractor_lead_time: ω_g below the course loop, guided disk margin >= 0.30 with c3 (2026-09-28);
    # 0.96 -> 1.05 (2026-10-03): Cabauw 10 m/s guided disk margin 0.477 -> 0.534, RMS cross-track error 1.27 -> 1.21°.
    # 1.05 -> 1.21 with heading_d 0.141 -> 0.146 (2026-10-05, retune_guided.jl, target 0.51): with wing drag
    # 0.03 Cabauw 9-10 m/s fly depower 0.365-0.393, where the kite responds slower; guided disk margin
    # 0.451/0.442 -> 0.524/0.515, worst of the 22 scenarios 0.513 (Maasvlakte 3.5 m/s).
    # 1.21 -> 1.05 (2026-10-06, retune_guided.jl tighten, floor 0.505): with the pattern delay approximation, depower
    # factor and kite correction re-identified with the wing drag the kite responds faster at high v_a;
    # guided disk margin of Cabauw 9-10 m/s 0.672/0.677 -> 0.611/0.617, worst 0.506 (Maasvlakte 3.5 m/s,
    # set by the arc's floor) unchanged.
    # 2026-10-25: wing drag back to 0, heading_d back to 0.141; lead 1.05 as before the drag.
    attractor_lead_time: 1.05    # Lead as flight time, arc = t*v_app/L; 0 = off   [s]
    reacquire_margin:    6.0     # Global best must beat the in-window best by this  [deg]
    up_loops:           false    # Up-loops instead of down-loops; down crosses the centre

  winch:  # compliance of the force-mode winch (its gains are in wc_settings.yaml) and force guards
    compliance:         0.0      # Fixed at POSITION mode; REEL_OUT needs the drum free [-]
    entry_f_min:        350.0    # Entry-guard (guard_lfc) force floor, phases 0-2; not wc's f_low [N]
    first_lap_force_frac: 0.96   # f_high x this in lap 1 AND for the startup solve; 1.0 = no lap-1 de-rating;
                                 # 0.93 until 2026-10-31, see docs/fig8_tuning_log.md [-]

  reelout:  # REEL_OUT winch and phase 5; kv/f_low/f_high/v_sat are in wc_settings.yaml
    reelout_l_max:      380.0    # Length at which reel-out stops; AWETrim's reopt ceiling is ~325 m [m]
    n_fig_eight:        0        # Laps after which reel-out stops; 0 = length only [-]
    reelout_softstart:  12.0     # Ramps the COMMANDED speed 0 -> v_set over this long  [s]
    reelout_softstop:   1.5      # Linear decel trigger at the far end               [s]
    reelout_delay:      4.2      # Wait after phase 3 before reel-out starts          [s]
    reelout_f_trigger:  6400.0   # Force that releases reel-out EARLY; Inf disables it [N]
    final_time:         30.0     # Sim time flown in phase 5 before the run ends; Inf = full run [s]
    depower_final:      0.35     # Flown from phase 5; tuned to hold ~3458 N at 6 m/s [-]
    depower_final_max:  0.42     # Ceiling of the phase-5 force limiter; = depower_final is OFF [-]
    depower_final_f_target: 7500.0 # Force the limiter holds, under 8400 N by the lobe swing [N]
    depower_final_f_gain: 6.0e-5 # Limiter integrator gain, depower per N per s    [1/(N s)]
    depower_final_f_gain_stop: 1.0e-4 # Same during the soft-stop ramp: 0.35 -> 0.40 in 3 s [1/(N s)]
    park_final:         true     # Phase 5 steers straight up (course 0), out of the power zone [-]
    park_lead:          6.0      # Parking climb starts this long before reel-out ends [s]
    el_offset_final:     1.0     # Extra lift of the path once reel-out ends       [deg]
    el_offset_lead:      8.0     # How early the lift starts; gets it past the phase-5 gate [s]
    final_margin_min:    1.5     # Phase-5 path below this curvature margin falls back; 0 = off [-]
    # 1.0 -> 0.5 with ff_gravity_rate 0.23 (2026-10-04): the kite no longer sags at the lobes, and the full
    # lift cost Maasvlakte 8.5-11 m/s 1.3-2.9 % of power and +12-28 % RMS d to the unlifted path.
    el_offset_wing:      0.5     # Extra lift at the LOBES, none in the centre       [deg]
    el_offset_wing_az:  10.0     # |azimuth| beyond which that lift is full   [deg or fraction of A]
    el_offset_wing_blend: 8.0    # Ramp width below it; NOT monotone, see the docstring  [same units]
    el_offset_wing_mode: "azimuth"  # azimuth (deg) | azimuth_frac (of the path's own A)

  low_wind:  # per wind speed at low_wind_height, linear in between, first row held below; off from the last row on
    # Flown 2026-10-02, the guided disk margin was 0.41-0.44 at 150 m: Maasvlakte 3.5 m/s (4.51 at 100 m),
    # Maasvlakte 4 m/s (5.15), Cabauw 3 m/s (5.80); Maasvlakte 5 m/s (6.44) is robust as the files fly it.
    # The last row is the files' own values: l_tethers and traj_opt's guess_el_center.
    low_wind_height:          100.0                      # Height of the wind the schedule is keyed on [m]
    low_wind_speeds:          [4.51, 5.15, 5.80, 6.40]   # Wind speed at low_wind_height, ascending [m/s]
    low_wind_l_tether:        [195.0, 195.0, 195.0, 150.0] # Tether length reel-out starts at; less guidance phase lag [m]
    low_wind_guess_el_center: [25.0, 27.0, 27.0, 29.0]   # Startup guess; 29° at 195 m lands in a 470 W optimum [deg]

  run:  # simulation conditions and pass criteria
    vsm_interval:       5        # Steps between VSM aero updates, 1 = tightest; at 10 the identification flights sink at depower 0.375 (2026-10-02) [-]
    elevation:          73.0     # Where init settles the kite; in the settled-state cache key [deg]
    warmup_time:        2.0      # Discarded warm-up run, right after `init`          [s]
    body_damping:       [0.0, 0.0, 40.0]  # Per axis; the turn_rate_coeffs key (settles to 0.8x)
    v_app_abort:        55.0     # Stop the run above this apparent wind speed      [m/s]
    entry_time:         62.0     # Settle time after park_time before the metrics     [s]
    min_elevation:       6.5     # Floor criterion over the WHOLE run; also the reopt install gate [deg]
    min_span_frac:      0.7      # Pattern-SIZE criterion, fraction of f8_a / f8_b    [-]
